name: CI

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-types:
    name: Lint & Type Safety (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements.txt
          pip install --no-deps -e .

      - name: Cache Mypy
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            mypy-${{ runner.os }}-py312-

      - name: Cache Ruff
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ruff-${{ runner.os }}-py312-

      - name: Install Audit Tools
        run: |
          pip install --only-binary :all: "pip-audit==2.10.1" "cyclonedx-bom==7.4.0" --quiet

      - name: Security Audit (pip-audit)
        run: |
          pip-audit --desc --require-hashes -r requirements.txt || true

      - name: SBOM (CycloneDX)
        run: |
          cyclonedx-py -o sbom.json . || true

      - name: Verify Code Formatting (Ruff)
        run: ruff format --check .

      - name: Lint Codebase (Ruff)
        run: ruff check .

      - name: Strict Static Type Check (Mypy)
        run: mypy src tests

  test-matrix:
    name: Test Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: [lint-and-types]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    env:
      TRACE_DATABASE_URL: "sqlite:///:memory:"
      TRACE_STORAGE_ROOT: "./.test_storage"

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements.txt
          pip install --no-deps -e .

      - name: Execute Pytest with Branch Coverage
        run: pytest --cov=trace_core --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  postgres-integration:
    name: PostgreSQL 16 Integration (${{ matrix.python-version }})
    needs: [lint-and-types]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TRACE_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/trace"
      TRACE_TEST_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/trace"
      TRACE_STORAGE_ROOT: "./.test_storage"

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements.txt
          pip install --no-deps -e .

      - name: Verify Database CLI Commands
        run: |
          trace db init
          trace db status
          trace db migrate

      - name: Run PostgreSQL Integration Tests
        run: pytest tests/integration/ -v
