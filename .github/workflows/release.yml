name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without publishing"
        default: true
        type: boolean
      min_version:
        description: "Minimum supported version for this release"
        default: "0.2.5"
        type: string
      notes:
        description: "Migration notes shown when minimum is not met"
        default: "One manual step is required below 0.2.5. Install this release wheel once with your trace venv python via pip install --force-reinstall --no-deps, or run a fresh install (pre-2.3 boxes remove ~/.trace/app first). Storage and database are untouched; afterwards updates are zero-touch again."
        type: string

permissions:
  contents: write

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Refuse re-publication
        if: github.event_name == 'push'
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; releases are immutable" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          pip install --require-hashes --only-binary :all: -r requirements.txt
          pip install --no-deps -e .
      - name: Tag equals package version
        run: |
          test "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME#v}"
      - run: python -m build --outdir dist-a
      - run: python -m build --outdir dist-b
      - name: Reproducibility check (wheels only; sdists embed nondeterministic metadata)
        run: |
          sha256sum dist-a/*.whl | sed 's/dist-a\///' | sort > sums-a.txt
          sha256sum dist-b/*.whl | sed 's/dist-b\///' | sort > sums-b.txt
          diff sums-a.txt sums-b.txt
          rm -rf dist-b sums-a.txt sums-b.txt
          mv dist-a dist
      - run: cyclonedx-py requirements requirements.txt -o sbom.json
      - run: sha256sum dist/* sbom.json > SHA256SUMS
      - name: Generate manifest
        env:
          MANIFEST_MIN_VERSION: ${{ inputs.min_version }}
          MANIFEST_NOTES: ${{ inputs.notes }}
        run: |
          MIN_VER="${MANIFEST_MIN_VERSION:-0.2.5}"
          if [ -z "$MANIFEST_NOTES" ]; then
            MANIFEST_NOTES="One manual step is required below 0.2.5. Install this release wheel once with your trace venv python via pip install --force-reinstall --no-deps, or run a fresh install (pre-2.3 boxes remove ~/.trace/app first). Storage and database are untouched; afterwards updates are zero-touch again."
          fi
          python release/make_manifest.py "${GITHUB_REF_NAME}" stable "${GITHUB_REF_NAME}" release-manifest.json --min-version "$MIN_VER" --notes "$MANIFEST_NOTES"
      - name: Assert update floor (fail closed without min-version + notes)
        run: |
          python -c "import json; m=json.load(open('release-manifest.json')); assert m.get('minimum_supported_version'), 'manifest missing minimum_supported_version'; assert m.get('notes'), 'manifest missing migration notes'; print('floor ok:', m['minimum_supported_version'])"
      - name: Sign release (fail closed without key)
        run: python release/sign_release.py release-manifest.json
        env:
          TRACE_RELEASE_SIGNING_KEY: ${{ secrets.TRACE_RELEASE_SIGNING_KEY }}
      - name: Self-verify with client verifier
        run: python release/verify_release.py release-manifest.json "${GITHUB_REF_NAME}"
      - name: Build channel + trust assets
        run: |
          cp release-manifest.json stable.json
          for f in release/trusted-keys/*.pub; do echo "$(basename "$f" .pub) $(cat "$f")"; done > trusted-keys.bundle
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          path: |
            dist/*
            sbom.json
            SHA256SUMS
            release-manifest.json
            stable.json
            trusted-keys.bundle
      - name: Publish immutable release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*
            sbom.json
            SHA256SUMS
            release-manifest.json
            stable.json
            trusted-keys.bundle
