[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace"
version = "0.3.1"
description = "Forensic Data Imaging & Retrieval Tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Trace Engineering Team" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.40",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg[binary]>=3.1.18",
    "structlog>=24.1.0",
    "textual>=8.2.8",
    "cryptography>=44",
    "packaging>=24",
]

# Floors are compatibility minima only. Production/dev installs MUST use the
# hash-locked requirements.txt (pyproject -> uv.lock -> requirements.txt chain).
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "anyio>=4.0",
    "build==1.6.1",
    "cyclonedx-bom==7.4.0",
]

[project.scripts]
trace = "trace_core.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
# C901 and PT are gates, not style: they are what stopped the SonarQube backlog
# (cognitive-complexity ceilings and pytest anti-patterns) from reopening.
select = ["E", "F", "I", "UP", "C901", "PT"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
parametrize-names-type = "tuple"
raises-require-match-for = ["BaseException", "Exception", "ValueError", "OSError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -v --strict-markers --strict-config"
markers = [
    "unit: Isolated unit tests using in-memory database and mocks",
    "integration: Integration tests requiring external services or databases",
    "slow: Tests with extensive computational or I/O workloads",
    "anyio: Async tests (registered for --strict-markers; plugin supplies the marker)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["trace_core"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
    "@abstractmethod",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

